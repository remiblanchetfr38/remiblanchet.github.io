<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes partitions</title>

  <style>
   
/* =================================
   IDENTITE VISUELLE
   Musique sacrée - Bleu et or
================================= */

:root {
  --bleu: #142c50;
  --bleu-clair: #315a8a;
  --bleu-pale: #eaf0f7;
  --blanc: #ffffff;
  --ivoire: #f8f7f2;
  --or: #c6a45b;
  --texte: #26364a;
}

/* =================================
   PAGE GENERALE
================================= */

body {
  font-family: Georgia, "Times New Roman", serif;
  background: var(--ivoire);
  color: var(--texte);

  max-width: 1000px;
  margin: 0 auto;
  padding: 40px 25px;

  line-height: 1.7;
}

/* =================================
   TITRE PRINCIPAL
================================= */

h1 {
  text-align: center;
  font-size: 46px;
  font-weight: normal;
  color: var(--bleu);

  padding-bottom: 20px;
  margin-bottom: 10px;

  border-bottom: 2px solid var(--or);
}

h1::before {
  content: "✝";
  display: block;
  color: var(--or);
  font-size: 30px;
  margin-bottom: 10px;
}

h2 {
  color: var(--bleu);
  font-size: 28px;
  font-weight: normal;

  border-bottom: 1px solid var(--or);
  padding-bottom: 8px;
  margin-top: 45px;
}

h3 {
  color: var(--bleu-clair);
  font-size: 22px;
  font-weight: normal;
}

/* =================================
   TEXTE DE PRESENTATION
================================= */

body > p {
  text-align: center;
  font-size: 17px;
  color: #53647a;
  max-width: 700px;
  margin: 25px auto 40px;
}

/* =================================
   CARTES DES PARTITIONS
================================= */

.partition {
  background: var(--blanc);

  padding: 25px;
  margin: 25px 0;

  border-radius: 6px;
  border-left: 5px solid var(--or);

  box-shadow: 0 4px 15px rgba(20, 44, 80, 0.08);

  transition: transform 0.25s, box-shadow 0.25s;
}

.partition:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 22px rgba(20, 44, 80, 0.14);
}

/* =================================
   LIENS ET TELECHARGEMENTS
================================= */

a {
  display: inline-block;

  background: var(--bleu);
  color: var(--blanc);

  padding: 10px 20px;
  margin-top: 10px;

  border-radius: 4px;
  text-decoration: none;

  transition: background 0.25s;
}

a:hover {
  background: var(--bleu-clair);
}

/* =================================
   DETAILS DECORATIFS
================================= */

.partition h3::before {
  content: "♫ ";
  color: var(--or);
}

/* =================================
   PIED DE PAGE
================================= */

footer {
  text-align: center;
  margin-top: 70px;
  padding: 25px;

  color: var(--bleu-clair);
  border-top: 1px solid var(--or);
  font-size: 14px;
}

/* =================================
   VERSION MOBILE
================================= */

@media (max-width: 600px) {

  body {
    padding: 20px 15px;
  }

  h1 {
    font-size: 34px;
  }

  h2 {
    font-size: 24px;
  }

  .partition {
    padding: 18px;
  }

}

  </style>
</head>

<body>

  <h1>Mes partitions</h1>

  <p>
    Bienvenue sur mon site de compositions musicales.
    Retrouvez ici mes partitions et mes morceaux.
  </p>

  <h2>Mes compositions</h2>

  <div class="partition">
    <h3>Prélude en do majeur</h3>

    <p>Une pièce pour piano solo.</p>

    <a href="partitions/prelude.pdf">
      Télécharger la partition PDF
    </a>
  </div>

  <div class="partition">
    <h3>Mon deuxième morceau</h3>

    <p>Une nouvelle composition à découvrir.</p>

    <a href="partitions/Rémi-Blanchet-Psaume-33-Funérailles.pdf">
  Télécharger la partition
</a>
  </div>

</body>
</html>
